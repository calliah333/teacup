<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporary File Sharing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        border: "hsl(214.3 31.8% 91.4%)",
                        input: "hsl(214.3 31.8% 91.4%)",
                        ring: "hsl(221.2 83.2% 53.3%)",
                        background: "hsl(0 0% 100%)",
                        foreground: "hsl(222.2 84% 4.9%)",
                        primary: {
                            DEFAULT: "hsl(221.2 83.2% 53.3%)",
                            foreground: "hsl(210 40% 98%)",
                        },
                        secondary: {
                            DEFAULT: "hsl(210 40% 96.1%)",
                            foreground: "hsl(222.2 47.4% 11.2%)",
                        },
                        destructive: {
                            DEFAULT: "hsl(0 84.2% 60.2%)",
                            foreground: "hsl(210 40% 98%)",
                        },
                        muted: {
                            DEFAULT: "hsl(210 40% 96.1%)",
                            foreground: "hsl(215.4 16.3% 46.9%)",
                        },
                        accent: {
                            DEFAULT: "hsl(210 40% 96.1%)",
                            foreground: "hsl(222.2 47.4% 11.2%)",
                        },
                        popover: {
                            DEFAULT: "hsl(0 0% 100%)",
                            foreground: "hsl(222.2 84% 4.9%)",
                        },
                        card: {
                            DEFAULT: "hsl(0 0% 100%)",
                            foreground: "hsl(222.2 84% 4.9%)",
                        },
                    },
                    borderRadius: {
                        lg: "0.5rem",
                        md: "calc(0.5rem - 2px)",
                        sm: "calc(0.5rem - 4px)",
                    },
                },
            },
        }
    </script>
    <style>
        @layer base {
            * {
                @apply border-border;
            }
            body {
                @apply bg-background text-foreground;
            }
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50">
    <div class="container mx-auto px-4 py-12 max-w-4xl">
        <!-- Header Card -->
        <div class="bg-card text-card-foreground rounded-lg border border-border shadow-sm mb-6 p-6">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-3xl font-bold tracking-tight mb-2">Teacup!</h1>
                    <p class="text-muted-foreground">A small and nimble file sharing service</p>
                </div>
                <button 
                    id="logoutBtn"
                    class="hidden bg-secondary text-secondary-foreground hover:bg-secondary/80 font-medium py-2 px-4 rounded-md transition-colors"
                >
                    Logout
                </button>
            </div>
        </div>

        <!-- Login Card -->
        <div id="loginCard" class="bg-card text-card-foreground rounded-lg border border-border shadow-sm mb-6 p-6">
            <h2 class="text-2xl font-semibold mb-4">Login Required</h2>
            <p class="text-muted-foreground mb-6">Please login to upload files</p>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label for="username" class="block text-sm font-medium mb-2">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username"
                        required
                        class="w-full px-3 py-2 border border-input rounded-md bg-background text-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2"
                        placeholder="Enter username"
                    >
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium mb-2">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password"
                        required
                        class="w-full px-3 py-2 border border-input rounded-md bg-background text-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2"
                        placeholder="Enter password"
                    >
                </div>
                <div id="loginError" class="hidden bg-destructive/10 border-destructive/50 text-destructive rounded-lg border p-4 text-sm"></div>
                <button 
                    type="submit"
                    id="loginBtn"
                    class="w-full bg-primary text-primary-foreground hover:bg-primary/90 font-medium py-2 px-4 rounded-md transition-colors disabled:opacity-50 disabled:cursor-not-allowed inline-flex items-center justify-center"
                >
                    <span id="loginText">Login</span>
                    <svg id="loginSpinner" class="hidden w-4 h-4 ml-2 animate-spin" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </form>
        </div>

        <!-- Upload Card -->
        <div id="uploadCard" class="bg-card text-card-foreground rounded-lg border border-border shadow-sm mb-6 p-6 hidden">
            <form id="uploadForm" enctype="multipart/form-data">
                <!-- Drop Zone -->
                <div 
                    id="dropZone" 
                    class="border-2 border-dashed border-input rounded-lg p-12 text-center cursor-pointer transition-colors hover:border-primary hover:bg-accent/50 mb-4"
                >
                    <div class="flex flex-col items-center justify-center space-y-4">
                        <svg class="w-12 h-12 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                        </svg>
                        <div class="text-center">
                            <p class="text-sm font-medium text-foreground mb-1">
                                Drag and drop files here, or click to select
                            </p>
                            <p class="text-xs text-muted-foreground">
                                Support for multiple files (max 100 MB per file)
                            </p>
                        </div>
                    </div>
                    <input type="file" id="fileInput" name="files" multiple class="hidden">
                </div>
                <div id="fileSizeError" class="hidden bg-destructive/10 border-destructive/50 text-destructive rounded-lg border p-4 text-sm mb-4"></div>

                <!-- Upload Button -->
                <button 
                    type="submit" 
                    id="uploadBtn"
                    class="w-full bg-primary text-primary-foreground hover:bg-primary/90 font-medium py-2 px-4 rounded-md transition-colors disabled:opacity-50 disabled:cursor-not-allowed inline-flex items-center justify-center"
                >
                    <svg id="uploadIcon" class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                    </svg>
                    <span id="uploadText">Upload Files</span>
                    <svg id="spinner" class="hidden w-4 h-4 mr-2 animate-spin" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </form>
        </div>

        <!-- Results Section -->
        <div id="results" class="space-y-4 mb-6"></div>

        <!-- Alert/Info Card -->
        <div class="bg-blue-50 border border-blue-200 text-blue-900 rounded-lg p-4">
            <div class="flex items-start space-x-3">
                <svg class="w-5 h-5 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <div>
                    <p class="text-sm font-medium">Automatic Cleanup</p>
                    <p class="text-sm text-blue-700 mt-1">All uploaded files will be automatically deleted after 3 hours.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const uploadForm = document.getElementById('uploadForm');
        const uploadBtn = document.getElementById('uploadBtn');
        const uploadText = document.getElementById('uploadText');
        const uploadIcon = document.getElementById('uploadIcon');
        const spinner = document.getElementById('spinner');
        const results = document.getElementById('results');
        const loginCard = document.getElementById('loginCard');
        const uploadCard = document.getElementById('uploadCard');
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const loginText = document.getElementById('loginText');
        const loginSpinner = document.getElementById('loginSpinner');
        const loginError = document.getElementById('loginError');
        const logoutBtn = document.getElementById('logoutBtn');
        const fileSizeError = document.getElementById('fileSizeError');

        const MAX_FILE_SIZE = 100 * 1024 * 1024; // 100 MB in bytes

        let isAuthenticated = false;

        // Check authentication status on page load
        async function checkAuth() {
            try {
                const response = await fetch('/check-auth');
                const data = await response.json();
                isAuthenticated = data.authenticated || false;
                updateUI();
            } catch (err) {
                console.error('Error checking auth:', err);
                isAuthenticated = false;
                updateUI();
            }
        }

        function updateUI() {
            if (isAuthenticated) {
                loginCard.classList.add('hidden');
                uploadCard.classList.remove('hidden');
                logoutBtn.classList.remove('hidden');
            } else {
                loginCard.classList.remove('hidden');
                uploadCard.classList.add('hidden');
                logoutBtn.classList.add('hidden');
                results.innerHTML = '';
            }
        }

        // Login form handler
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            loginBtn.disabled = true;
            loginText.textContent = 'Logging in...';
            loginSpinner.classList.remove('hidden');
            loginError.classList.add('hidden');
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                });
                
                const data = await response.json();
                
                if (data.success) {
                    isAuthenticated = true;
                    updateUI();
                    document.getElementById('username').value = '';
                    document.getElementById('password').value = '';
                } else {
                    loginError.textContent = data.error || 'Login failed';
                    loginError.classList.remove('hidden');
                }
            } catch (err) {
                loginError.textContent = 'Login failed: ' + err.message;
                loginError.classList.remove('hidden');
            } finally {
                loginBtn.disabled = false;
                loginText.textContent = 'Login';
                loginSpinner.classList.add('hidden');
            }
        });

        // Logout handler
        logoutBtn.addEventListener('click', async () => {
            try {
                await fetch('/logout', { method: 'POST' });
                isAuthenticated = false;
                updateUI();
            } catch (err) {
                console.error('Logout error:', err);
            }
        });

        // Click to select files
        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        // Clear errors when files are selected
        fileInput.addEventListener('change', () => {
            fileSizeError.classList.add('hidden');
        });

        // Drag and drop handlers
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-primary', 'bg-accent/50');
            dropZone.classList.remove('border-input');
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-primary', 'bg-accent/50');
            dropZone.classList.add('border-input');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-primary', 'bg-accent/50');
            dropZone.classList.add('border-input');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                const dt = new DataTransfer();
                for (let file of files) {
                    dt.items.add(file);
                }
                fileInput.files = dt.files;
                uploadForm.dispatchEvent(new Event('submit', { cancelable: true }));
            }
        });

        // File size validation
        function validateFiles(files) {
            const errors = [];
            for (let file of files) {
                if (file.size > MAX_FILE_SIZE) {
                    const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
                    errors.push(`${file.name}: ${sizeMB} MB (max 100 MB)`);
                }
            }
            return errors;
        }

        // Form submission handler
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!fileInput.files.length) return;
            
            // Validate file sizes before upload
            const sizeErrors = validateFiles(fileInput.files);
            if (sizeErrors.length > 0) {
                fileSizeError.innerHTML = `
                    <p class="font-medium mb-2">File size limit exceeded:</p>
                    <ul class="list-disc list-inside space-y-1">
                        ${sizeErrors.map(err => `<li>${escapeHtml(err)}</li>`).join('')}
                    </ul>
                `;
                fileSizeError.classList.remove('hidden');
                return;
            }
            
            fileSizeError.classList.add('hidden');
            uploadBtn.disabled = true;
            uploadText.textContent = 'Uploading...';
            uploadIcon.classList.add('hidden');
            spinner.classList.remove('hidden');
            results.innerHTML = '';
            
            const formData = new FormData();
            for (let file of fileInput.files) {
                formData.append('files', file);
            }
            
            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                // Handle authentication errors
                if (response.status === 401) {
                    isAuthenticated = false;
                    updateUI();
                    results.innerHTML = `
                        <div class="bg-destructive/10 border-destructive/50 text-destructive rounded-lg border p-4">
                            <p class="font-medium">Session expired</p>
                            <p class="text-sm mt-1">Please login again to upload files.</p>
                        </div>
                    `;
                    return;
                }
                
                if (data.success) {
                    let html = '';
                    
                    // Show uploaded files
                    if (data.files && data.files.length > 0) {
                        html += `
                            <div class="bg-card text-card-foreground rounded-lg border border-border shadow-sm p-6 mb-4">
                                <h3 class="text-lg font-semibold mb-4 flex items-center">
                                    <svg class="w-5 h-5 mr-2 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                    </svg>
                                    Upload Successful!
                                </h3>
                                <div class="space-y-3">
                        `;
                        
                        data.files.forEach(file => {
                            const url = file.url || (window.location.origin + '/' + file.hash + (file.extension || ''));
                            html += `
                                <div class="bg-accent rounded-md p-4 border border-border">
                                    <div class="flex items-start justify-between">
                                        <div class="flex-1 min-w-0">
                                            <p class="text-sm font-medium text-foreground mb-1 truncate">${escapeHtml(file.filename)}</p>
                                            <div class="flex items-center space-x-2">
                                                <a 
                                                    href="${url}" 
                                                    target="_blank" 
                                                    rel="noopener noreferrer"
                                                    class="text-sm text-primary hover:underline font-mono break-all"
                                                >
                                                    ${url}
                                                </a>
                                                <button 
                                                    onclick="navigator.clipboard.writeText('${url}')"
                                                    class="ml-2 p-1 hover:bg-background rounded transition-colors"
                                                    title="Copy link"
                                                >
                                                    <svg class="w-4 h-4 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                                                    </svg>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                        
                        html += `
                                </div>
                            </div>
                        `;
                    }
                    
                    // Show errors if any
                    if (data.errors && data.errors.length > 0) {
                        html += `
                            <div class="bg-destructive/10 border-destructive/50 text-destructive rounded-lg border p-4">
                                <p class="font-medium mb-2">Upload errors:</p>
                                <ul class="list-disc list-inside space-y-1 text-sm">
                                    ${data.errors.map(err => `<li><strong>${escapeHtml(err.filename)}</strong>: ${escapeHtml(err.error)}</li>`).join('')}
                                </ul>
                            </div>
                        `;
                    }
                    
                    if (!html && (!data.files || data.files.length === 0)) {
                        html = `
                            <div class="bg-card text-card-foreground rounded-lg border border-border shadow-sm p-6">
                                <p class="text-muted-foreground">No files were uploaded.</p>
                            </div>
                        `;
                    }
                    
                    results.innerHTML = html;
                } else {
                    results.innerHTML = `
                        <div class="bg-destructive/10 border-destructive/50 text-destructive rounded-lg border p-4">
                            <p class="font-medium">Upload failed</p>
                            <p class="text-sm mt-1">${escapeHtml(data.error || 'Unknown error occurred')}</p>
                        </div>
                    `;
                }
            } catch (err) {
                results.innerHTML = `
                    <div class="bg-destructive/10 border-destructive/50 text-destructive rounded-lg border p-4">
                        <p class="font-medium">Upload failed</p>
                        <p class="text-sm mt-1">${escapeHtml(err.message)}</p>
                    </div>
                `;
            } finally {
                uploadBtn.disabled = false;
                uploadText.textContent = 'Upload Files';
                uploadIcon.classList.remove('hidden');
                spinner.classList.add('hidden');
                fileInput.value = '';
            }
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize on page load
        checkAuth();
    </script>
</body>
</html>
